<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venda Tupy</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="header-top">

        <h1>Venda Tupy</h1>

    </div>

    <div class="barra-pesquisa">

        <input
            type="text"
            id="pesquisa"
            placeholder="🔍 Pesquisar produto...">

    </div>

    <div class="filtros">

        <select id="filtroSecao">
            <option value="">📂 Todas as seções</option>
        </select>

        <select id="ordenacao">

            <option value="descricao">
                🔤 Nome (A-Z)
            </option>

            <option value="preco">
                💲 Menor preço
            </option>

            <option value="estoque">
                📦 Maior estoque
            </option>

        </select>

    </div>

    <div class="informacoes">

        <span id="contador">

            Carregando produtos...

        </span>

    </div>

</header>

<main>

    <div id="loading">

        Carregando produtos...

    </div>

    <div id="produtos"></div>

</main>

<footer>

    <p>

        © Venda Tupy

    </p>

</footer>

<script src="script.js"></script>

</body>

</html>
